# fast, no thinking, does tool calls. reasoning ones (gpt-oss:20b, qwen3.5:397b) via --model
model: gemma4:31b

ollama:
  # cloud only, no model runs locally. needs OLLAMA_API_KEY in .env
  host: https://ollama.com
  timeout: 120

# optional, #3 adds the user profile on top
system_prompt: >-
  You are sensai, a research assistant for quantitative developers and researchers.
  Answer precisely and say when you are unsure.

# reasoning models think for a few seconds 1st, shown dim so the stream is visible. /think toggles it
show_thinking: true

paths:
  data: data
  out: out
  sessions: sessions

# filled in #5
mcp_servers: []

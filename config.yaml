# fast, no thinking, does tool calls, reasoning ones (gpt-oss:20b, qwen3.5:397b) via --model
model: gemma4:31b

ollama:
  # cloud, no model on this machine, needs OLLAMA_API_KEY in .env
  host: https://ollama.com
  timeout: 120

# optional, today's date and the user profile (~/.sensai/profile.yaml) are added after it
system_prompt: >-
  You are sensai, a research assistant for quantitative developers and researchers.
  Answer precisely and say when you are unsure.
  Use the tools for any market data (prices, fundamentals, news, sentiment) and never invent a number.
  When the user doesn't name a ticker, use the ones from their profile.
  Your answers are shown in a plain terminal: never use LaTeX or math markup, write numbers as plain text (+20.66%).

# reasoning models think for a few seconds 1st, shown dim -> the stream stays visible, /think toggles it
show_thinking: true

# MCP servers started w/ sensai, their tools are offered to the model
# a server that fails to start is a warning, the others still work, `enabled: false` skips one
# stderr -> ~/.sensai/logs/, each server's limits (its MCP instructions, or `limits:` here) go in
# the system prompt -> the model knows what its tools cant do
mcp_servers:
  # ours (#4): prices, fundamentals, news, sentiment
  - name: quant-data
    command: python          # = the python running sensai
    args: [-m, sensai.servers.quant_data]
  # preexisting, official: reads a web page as markdown (the full article behind a headline)
  # pinned to mcp<2 -> uvx runs it in its own env, downloaded on the 1st run
  - name: fetch
    command: uvx
    args: [mcp-server-fetch]
    # not ours -> its limits are written here
    limits: Reads 1 web page from an exact URL and returns it as Markdown. It can't search, use
      web search to find URLs. Some sites refuse it (robots.txt, paywalls, logins).
  # ours (#17): live web search through tavily, needs TAVILY_API_KEY
  - name: web
    command: python
    args: [-m, sensai.servers.web]
  # ours (#7): run_python, the model's code in docker (no network) or a limited subprocess
  # image: docker build -t sensai-sandbox sandbox/, plots + outputs in out/ ($SENSAI_OUT)
  - name: sandbox
    command: python
    args: [-m, sensai.servers.sandbox]

# the reasoning loop's budget per question (#6): tool calls, and tokens read + written over all
# its rounds, past either one -> 1 last round w/o tools, the model answers w/ what it has
max_steps: 12
token_budget: 60000
